name: Release

# Push a tag like v0.3.0 to build the Windows and Mac apps, the Chrome extension and the Claude
# Desktop extension (apps/mcp, also bundled inside the desktop app), attach them
# to one GitHub Release, and publish it. The notes are .github/release-notes.md with the tag's
# section of CHANGELOG.md filled in, so add that section before tagging.
#
# The four files keep the same names in every release, so
# https://github.com/<repo>/releases/latest/download/<name> always points at the newest one:
# Sourcefold-Windows-Setup.exe, Sourcefold-Mac.dmg, Sourcefold-Chrome-Extension.zip and
# Sourcefold-Claude.mcpb (the desktop app's Settings → Claude falls back to downloading it).
#
# In-app updates: the desktop app reads releases/latest/download/latest.json (tauri.conf.json →
# plugins.updater). Each desktop build signs its update file with the repository secret
# TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key has one), and the
# publish job writes latest.json from the signatures. Windows updates with the setup .exe itself;
# Mac with Sourcefold-Mac.app.tar.gz. The key's public half is in tauri.conf.json: never change the
# key, or every installed app stops accepting updates.
#
# Set the repository variables SOURCEFOLD_SUPABASE_URL and SOURCEFOLD_SUPABASE_PUBLISHABLE_KEY so
# the desktop app and the extension sign in to your Supabase project out of the box (they need no
# website). The optional SOURCEFOLD_WEB_URL points the release notes at the website.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  WEB_URL: ${{ vars.SOURCEFOLD_WEB_URL }}

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 || $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "CHANGELOG.md has no section for $VERSION. Add '## $VERSION (date)' with the changes."
            exit 1
          fi
          URL="${WEB_URL:-Ask whoever runs your Sourcefold for the address}"
          sed -e "s|{{WEB_URL}}|${URL}|g" -e "s|{{VERSION}}|${VERSION}|g" \
            -e "s|{{TAG}}|${TAG}|g" -e "s|{{REPO}}|${REPO}|g" \
            -e '/{{CHANGES}}/{r changes.md' -e 'd}' \
            .github/release-notes.md > notes.md
          cat notes.md
          gh release create "$TAG" --draft --title "Sourcefold $TAG" --notes-file notes.md

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: create-release
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: "--bundles nsis"
            rust-targets: ""
            suffix: "_x64-setup.exe"
            asset: Sourcefold-Windows-Setup.exe
            # Windows updates by running the installer itself, so its signature is all it needs.
            update-name: ""
            update-asset: ""
          - name: Mac
            platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            suffix: "_universal.dmg"
            asset: Sourcefold-Mac.dmg
            update-name: Sourcefold.app.tar.gz
            update-asset: Sourcefold-Mac.app.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Build the Claude extension
        env:
          SOURCEFOLD_WEB_URL: ${{ vars.SOURCEFOLD_WEB_URL }}
        run: npm run build -w @sourcefold/mcp

      # The bundle ships inside the app so Settings → Claude → Add to Claude Desktop works offline
      # and matches the app's version. Only release builds add it: dev builds read apps/mcp/dist.
      - name: Build
        working-directory: apps/desktop
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ vars.SOURCEFOLD_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SOURCEFOLD_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SOURCEFOLD_WEB_URL: ${{ vars.SOURCEFOLD_WEB_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          npm run tauri -- build ${{ matrix.args }}
          --config '{"bundle":{"resources":{"../../mcp/dist/Sourcefold-Claude.mcpb":"Sourcefold-Claude.mcpb"}}}'

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Match this tag's version: the cargo cache can keep older installers in the bundle
          # folder, and a version that doesn't match the tag fails here instead of shipping.
          NAME="Sourcefold_${TAG#v}${{ matrix.suffix }}"
          FILE=$(find apps/desktop/src-tauri/target -path '*/release/bundle/*' -name "$NAME" | head -n 1)
          if [ -z "$FILE" ]; then echo "$NAME wasn't built. Does tauri.conf.json have the tag's version?"; exit 1; fi
          echo "Built $FILE"
          cp "$FILE" "${{ matrix.asset }}"
          gh release upload "$TAG" "${{ matrix.asset }}" --clobber

          # The update file and its signature, for latest.json (built by the publish job).
          UPDATE_NAME="${{ matrix.update-name }}"
          UPDATE_ASSET="${{ matrix.update-asset }}"
          if [ -z "$UPDATE_NAME" ]; then
            UPDATE_FILE="$FILE"
            UPDATE_ASSET="${{ matrix.asset }}"
          else
            UPDATE_FILE=$(find "$(dirname "$FILE")/.." -path '*/macos/*' -name "$UPDATE_NAME" | head -n 1)
            if [ -z "$UPDATE_FILE" ]; then echo "$UPDATE_NAME wasn't built."; exit 1; fi
            cp "$UPDATE_FILE" "$UPDATE_ASSET"
            gh release upload "$TAG" "$UPDATE_ASSET" --clobber
          fi
          if [ ! -f "$UPDATE_FILE.sig" ]; then
            echo "$UPDATE_FILE.sig is missing. Is the TAURI_SIGNING_PRIVATE_KEY secret set?"
            exit 1
          fi
          cp "$UPDATE_FILE.sig" "$UPDATE_ASSET.sig"
          gh release upload "$TAG" "$UPDATE_ASSET.sig" --clobber

  extension:
    name: Chrome and Claude extensions
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        env:
          WXT_SUPABASE_URL: ${{ vars.SOURCEFOLD_SUPABASE_URL }}
          WXT_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SOURCEFOLD_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build -w @sourcefold/extension

      - name: Zip and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/extension/.output
          rm -rf sourcefold-extension
          cp -r chrome-mv3 sourcefold-extension
          zip -r ../../../Sourcefold-Chrome-Extension.zip sourcefold-extension
          cd ../../..
          gh release upload "$TAG" Sourcefold-Chrome-Extension.zip --clobber

      - name: Build and upload the Claude extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCEFOLD_WEB_URL: ${{ vars.SOURCEFOLD_WEB_URL }}
        run: |
          npm run build -w @sourcefold/mcp
          gh release upload "$TAG" apps/mcp/dist/Sourcefold-Claude.mcpb --clobber

  publish:
    name: Publish release
    needs: [desktop, extension]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write latest.json for in-app updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          gh release download "$TAG" --repo "$REPO" --dir sigs --pattern '*.sig'
          awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 || $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > changes.md
          BASE="https://github.com/$REPO/releases/download/$TAG"
          MAC_SIG=$(cat sigs/Sourcefold-Mac.app.tar.gz.sig)
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes changes.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_sig "$(cat sigs/Sourcefold-Windows-Setup.exe.sig)" \
            --arg win_url "$BASE/Sourcefold-Windows-Setup.exe" \
            --arg mac_sig "$MAC_SIG" \
            --arg mac_url "$BASE/Sourcefold-Mac.app.tar.gz" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
              "windows-x86_64": {signature: $win_sig, url: $win_url},
              "darwin-aarch64": {signature: $mac_sig, url: $mac_url},
              "darwin-x86_64": {signature: $mac_sig, url: $mac_url}
            }}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber

      - name: Check every download is attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          for name in Sourcefold-Windows-Setup.exe Sourcefold-Mac.dmg Sourcefold-Chrome-Extension.zip Sourcefold-Claude.mcpb \
            Sourcefold-Windows-Setup.exe.sig Sourcefold-Mac.app.tar.gz Sourcefold-Mac.app.tar.gz.sig latest.json; do
            echo "$ASSETS" | grep -qx "$name" || { echo "Missing $name"; exit 1; }
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
