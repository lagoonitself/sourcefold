name: Release

# Push a tag like v0.2.0 to build the Windows and macOS installers and the Chrome extension,
# attach them to one GitHub Release, and publish it with the install guide
# (.github/release-notes.md). Set the repository variable SOURCEFOLD_WEB_URL to the deployed
# web app so the desktop app and the extension point at it out of the box.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  WEB_URL: ${{ vars.SOURCEFOLD_WEB_URL }}

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          URL="${WEB_URL:-the Sourcefold web address you were given}"
          sed -e "s|{{WEB_URL}}|${URL}|g" -e "s|{{VERSION}}|${VERSION}|g" \
            .github/release-notes.md > notes.md
          gh release create "$TAG" --draft --title "Sourcefold $TAG" --notes-file notes.md
          ID=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          if [ -z "$ID" ]; then echo "Couldn't read the release ID"; exit 1; fi
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop installer (${{ matrix.platform }})
    needs: create-release
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust-targets: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Build and upload installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SOURCEFOLD_WEB_URL: ${{ vars.SOURCEFOLD_WEB_URL }}
        with:
          projectPath: "./apps/desktop"
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.args }}

  extension:
    name: Chrome extension
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        env:
          WXT_SOURCEFOLD_WEB_URL: ${{ vars.SOURCEFOLD_WEB_URL }}
        run: npm run build -w @sourcefold/extension

      - name: Zip and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/extension/.output
          rm -rf sourcefold-extension
          cp -r chrome-mv3 sourcefold-extension
          zip -r ../../../sourcefold-extension-chrome.zip sourcefold-extension
          cd ../../..
          gh release upload "$TAG" sourcefold-extension-chrome.zip --clobber

  publish:
    name: Publish release
    needs: [desktop, extension]
    runs-on: ubuntu-latest
    steps:
      - name: Check every download is attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          for pattern in '_x64-setup[.]exe$' '_universal[.]dmg$' '^sourcefold-extension-chrome[.]zip$'; do
            echo "$ASSETS" | grep -Eq "$pattern" || { echo "Missing a file matching $pattern"; exit 1; }
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
