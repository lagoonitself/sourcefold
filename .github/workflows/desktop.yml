name: Desktop CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-ci:
    name: Desktop CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Build frontend
        run: npm run build -w @sourcefold/desktop

      - name: Cargo clippy
        run: cargo clippy -- -D warnings
        working-directory: apps/desktop/src-tauri

      - name: Cargo test
        run: cargo test
        working-directory: apps/desktop/src-tauri

      - name: Tauri debug build (no bundle)
        run: npx tauri build --debug --no-bundle
        working-directory: apps/desktop
