name: Release

# Push a tag like v0.3.0 to build the Windows and Mac apps and the Chrome extension, attach them
# to one GitHub Release, and publish it. The notes are .github/release-notes.md with the tag's
# section of CHANGELOG.md filled in, so add that section before tagging.
#
# The three files keep the same names in every release, so
# https://github.com/<repo>/releases/latest/download/<name> always points at the newest one:
# Sourcefold-Windows-Setup.exe, Sourcefold-Mac.dmg and Sourcefold-Chrome-Extension.zip.
#
# Set the repository variable SOURCEFOLD_WEB_URL to the deployed website so the desktop app and
# the extension point at it out of the box.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  WEB_URL: ${{ vars.SOURCEFOLD_WEB_URL }}

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 || $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "CHANGELOG.md has no section for $VERSION. Add '## $VERSION (date)' with the changes."
            exit 1
          fi
          URL="${WEB_URL:-Ask whoever runs your Sourcefold for the address}"
          sed -e "s|{{WEB_URL}}|${URL}|g" -e "s|{{VERSION}}|${VERSION}|g" \
            -e "s|{{TAG}}|${TAG}|g" -e "s|{{REPO}}|${REPO}|g" \
            -e '/{{CHANGES}}/{r changes.md' -e 'd}' \
            .github/release-notes.md > notes.md
          cat notes.md
          gh release create "$TAG" --draft --title "Sourcefold $TAG" --notes-file notes.md

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: create-release
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: "--bundles nsis"
            rust-targets: ""
            pattern: "*_x64-setup.exe"
            asset: Sourcefold-Windows-Setup.exe
          - name: Mac
            platform: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            pattern: "*_universal.dmg"
            asset: Sourcefold-Mac.dmg
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Build
        working-directory: apps/desktop
        shell: bash
        env:
          VITE_SOURCEFOLD_WEB_URL: ${{ vars.SOURCEFOLD_WEB_URL }}
        run: npm run tauri -- build ${{ matrix.args }}

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE=$(find apps/desktop/src-tauri/target -path '*/release/bundle/*' -name '${{ matrix.pattern }}' | head -n 1)
          if [ -z "$FILE" ]; then echo "No installer matching ${{ matrix.pattern }} was built"; exit 1; fi
          echo "Built $FILE"
          cp "$FILE" "${{ matrix.asset }}"
          gh release upload "$TAG" "${{ matrix.asset }}" --clobber

  extension:
    name: Chrome extension
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        env:
          WXT_SOURCEFOLD_WEB_URL: ${{ vars.SOURCEFOLD_WEB_URL }}
        run: npm run build -w @sourcefold/extension

      - name: Zip and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/extension/.output
          rm -rf sourcefold-extension
          cp -r chrome-mv3 sourcefold-extension
          zip -r ../../../Sourcefold-Chrome-Extension.zip sourcefold-extension
          cd ../../..
          gh release upload "$TAG" Sourcefold-Chrome-Extension.zip --clobber

  publish:
    name: Publish release
    needs: [desktop, extension]
    runs-on: ubuntu-latest
    steps:
      - name: Check every download is attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          for name in Sourcefold-Windows-Setup.exe Sourcefold-Mac.dmg Sourcefold-Chrome-Extension.zip; do
            echo "$ASSETS" | grep -qx "$name" || { echo "Missing $name"; exit 1; }
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
